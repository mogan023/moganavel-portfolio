<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Details | Moganavel Venkatachalam</title>

    <link rel="stylesheet" href="../css/style.css">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        .project-details-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 120px 30px 80px;
        }

        .project-details-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            text-decoration: none;
        }

        .project-details-image {
            width: 100%;
            max-height: 520px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
            margin-bottom: 35px;
        }

        .project-details-category {
            display: inline-block;
            margin-bottom: 12px;
        }

        .project-details-title {
            margin: 0 0 20px;
        }

        .project-details-description {
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .project-details-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .project-details-tech span {
            padding: 8px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
        }

        .project-details-stats {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .project-details-like {
            background: none;
            border: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .project-details-like i,
        .project-details-view i {
            color: white;
        }

        .project-details-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .project-details-loading,
        .project-details-error {
            text-align: center;
            padding: 100px 20px;
        }
    </style>
</head>

<body>

<main id="projectDetails">

    <div class="project-details-loading">
        Loading project...
    </div>

</main>


<script src="../js/project-details.js"></script>

</body>

</html>
